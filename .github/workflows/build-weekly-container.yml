name: 容器化增量编译 HINLINK H28K 固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '指定源码 Tag (如 v25.12.1)'
        required: true
        default: 'v25.12.1'
        type: string
      use_cache_image:
        description: '优先使用 GHCR 对应版本的增量镜像'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write # 必须开放 GHCR 镜像写入权限

concurrency:
  group: build-hinlink-h28k-container
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      # 以输入的版本号 (例如 v25.12.1) 作为镜像 Tag，重复 push 会自动覆盖，不产生多余镜像
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/h28k-build-cache:${{ inputs.target_tag }}

    steps:
      - name: 初始化日志目录
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"

      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 清理 Runner 磁盘空间
        run: |
          echo "=== Before cleanup ==="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h / | tail -1

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查是否存在对应版本的增量镜像
        id: check-image
        run: |
          set +e
          if [ "${{ inputs.use_cache_image }}" = "true" ]; then
            echo "尝试拉取对应版本的增量镜像: ${{ env.IMAGE_NAME }}"
            if docker pull ${{ env.IMAGE_NAME }}; then
              echo "FOUND_IMAGE=true" >> "$GITHUB_OUTPUT"
              echo "✅ 成功匹配到版本 ${{ inputs.target_tag }} 的增量镜像！本次将进行增量编译。"
            else
              echo "FOUND_IMAGE=false" >> "$GITHUB_OUTPUT"
              echo "⚠️ 未找到版本 ${{ inputs.target_tag }} 的增量镜像，本次将进行全量编译。"
            fi
          else
            echo "FOUND_IMAGE=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 用户选择跳过镜像缓存，本次进行全量编译。"
          fi

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          {
            # 1. 彻底卸载 needrestart，防止其在 CI 环境中扫描 Runner 进程并返回 1 退出码
            sudo apt-get remove -y --purge needrestart || true

            # 2. 自动化静默安装依赖
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo -E apt-get install -y -qq \
              ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
              bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
              gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
              lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
              libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
              libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build openssl p7zip \
              p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
              python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
              texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd jq time
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/安装编译依赖.log"

      - name: 解析编译版本
        id: release
        run: |
          set -eu
          RELEASE_TAG="${{ inputs.target_tag }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $RELEASE_TAG"

      # 1. 如果存在增量镜像：直接提取镜像内的 source 工作区
      - name: 还原增量编译工作区
        if: steps.check-image.outputs.FOUND_IMAGE == 'true'
        run: |
          set -euo pipefail
          echo "正在从 Docker 镜像提取上次编译的中间态文件..."
          CONTAINER_ID=$(docker create ${{ env.IMAGE_NAME }})
          docker cp "$CONTAINER_ID:/builder/source" "$GITHUB_WORKSPACE/source"
          docker rm "$CONTAINER_ID"
          echo "已成功还原增量工作区！"

      # 2. 如果不存在增量镜像：从 0 开始全量克隆
      - name: 全量克隆源码
        if: steps.check-image.outputs.FOUND_IMAGE != 'true'
        run: |
          set -euo pipefail
          {
            git clone --branch "${{ steps.release.outputs.tag }}" --single-branch --depth=1 \
              https://github.com/immortalwrt/immortalwrt.git source
            echo "=== Clone completed, disk space ==="
            df -h / | tail -1
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/克隆指定版本源码.log"

      # 3. 无论是增量还是全量，都重新更新/同步你最新提交的第三方插件、补丁和配置文件
      - name: 同步最新的补丁与配置文件 (适配增量)
        working-directory: source
        run: |
          set -euo pipefail
          {
            # 重新应用最新 repository 里的补丁
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "=== Applying patch: $(basename "$patch") ==="
              git apply --check --3way "$patch" || {
                echo "Patch check failed: $patch"
                git apply --reject "$patch" || true
                find . -name '*.rej' -print -exec cat {} \;
                exit 1
              }
              git apply --3way "$patch"
            done
            
            if [ -f "include/feeds.mk" ]; then
              sed -i 's/CONFIG_BUILDBOT/CONFIG_ALL_KMODS/g' include/feeds.mk || true
            fi

            # 重新更新/安装 feeds（如果新增或删除了 package 目录，这里会自动同步）
            bash "$GITHUB_WORKSPACE/scripts/build_config.sh" prepare \
              . \
              "$GITHUB_WORKSPACE/config/firmware.conf" \
              "$GITHUB_WORKSPACE/config/packages.conf"
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/应用构建配置.log"

      - name: 提取官方内核配置 (全量构建时执行)
        if: steps.check-image.outputs.FOUND_IMAGE != 'true'
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          {
            BUILDINFO_URL="https://downloads.immortalwrt.org/releases/${RELEASE_VERSION}/targets/rockchip/armv8"
            curl -fsSL "$BUILDINFO_URL/config.buildinfo" -o .config.buildinfo

            awk '
              /^CONFIG_ALL_KMODS=y$/ ||
              /^CONFIG_DEVEL=y$/ ||
              (/^CONFIG_KERNEL_[A-Za-z0-9_]+=/ &&
                $0 !~ /^CONFIG_KERNEL_BUILD_(DOMAIN|USER)=/) ||
              /^# CONFIG_KERNEL_[A-Za-z0-9_]+ is not set$/
            ' .config.buildinfo > .config.official

            cat .config.official \
              "$GITHUB_WORKSPACE/config/hinlink-h28k.config" > .config
            make defconfig
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/提取官方内核配置.log"

      - name: 下载源码包
        working-directory: source
        timeout-minutes: 90
        run: |
          set -euo pipefail
          {
            make -j"$(nproc)" download V=s
            find dl -size -1024c -print -delete
            du -sh dl
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/下载源码包.log"

      - name: 编译固件
        id: build-step
        working-directory: source
        timeout-minutes: 300
        run: |
          LOG_FILE="$GITHUB_WORKSPACE/logs/编译固件.log"
          echo "=== Build started at $(date) ===" | tee -a "$LOG_FILE"
          echo ">>> 阶段 1：启动多线程并行编译 (-j$(nproc))..." | tee -a "$LOG_FILE"
          
          set +e
          make -j"$(nproc)" 2>&1 | tee -a "$LOG_FILE"
          BUILD_CODE=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_CODE -eq 0 ]; then
            echo "=== 并行编译顺利完成 ===" | tee -a "$LOG_FILE"
          else
            echo "--------------------------------------------------" | tee -a "$LOG_FILE"
            echo ">>> 阶段 1 编译失败！切换到阶段 2：单线程详细模式排查 (-j1 V=s)..." | tee -a "$LOG_FILE"
            echo "--------------------------------------------------" | tee -a "$LOG_FILE"
            
            set +e
            make -j1 V=s 2>&1 | tee -a "$LOG_FILE"
            FAIL_CODE=${PIPESTATUS[0]}
            set -e

            echo "=== 编译彻底失败 at $(date), exit code: $FAIL_CODE ===" | tee -a "$LOG_FILE"
            exit "$FAIL_CODE"
          fi

          echo "=== Build finished successfully at $(date) ===" | tee -a "$LOG_FILE"

      # 关键步骤：不论成功还是失败 (always())，都将最新的工作区状态打包覆盖推送至对应的 Tag
      - name: 保存并推送增量编译镜像 (覆盖当前版本 Tag)
        if: always() && steps.build-step.conclusion != 'skipped'
        run: |
          echo "正在将本次编译后的工作区状态打包进 Docker 镜像..."
          
          cat << 'EOF' > Dockerfile.cache
          FROM ubuntu:24.04
          WORKDIR /builder
          COPY source /builder/source
          EOF

          echo "构建镜像: ${{ env.IMAGE_NAME }}..."
          docker build -f Dockerfile.cache -t ${{ env.IMAGE_NAME }} .

          echo "推送并覆盖更新镜像仓库..."
          docker push ${{ env.IMAGE_NAME }}
          echo "✅ 镜像推送完成！下次更新代码或编译相同 Tag (${{ inputs.target_tag }}) 时将直接进行秒级增量编译。"

      - name: 校验内核 ABI
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          {
            bash "$GITHUB_WORKSPACE/scripts/build_config.sh" check-abi \
              . \
              "$GITHUB_WORKSPACE/config/firmware.conf" \
              "$RELEASE_VERSION" \
              "$RELEASE_TAG" \
              "$GITHUB_ENV"
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/校验内核 ABI.log"

      - name: 检查固件产物
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          {
            shopt -s nullglob
            FIRMWARE_FILES=(bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz)
            if [ "${#FIRMWARE_FILES[@]}" -eq 0 ]; then
              echo "HINLINK H28K sysupgrade firmware not found"
              ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || true
              exit 1
            fi
            ls -lh "${FIRMWARE_FILES[@]}"
            echo "BUILD_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_ENV"
            echo "UPSTREAM_HASH=$(git log -1 --format='%h')" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            sed -n 's/^lan_ip=/FIRMWARE_LAN_IP=/p; s/^password=/FIRMWARE_PASSWORD=/p' \
              "$GITHUB_WORKSPACE/config/firmware.conf" >> "$GITHUB_ENV"
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/检查固件产物.log"

      - name: 上传固件构件
        uses: actions/upload-artifact@v4
        with:
          name: HINLINK H28K 固件-${{ env.RELEASE_TAG }}
          path: source/bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz
          retention-days: 30

      - name: 发布固件 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h28k-${{ env.RELEASE_TAG }}-${{ env.BUILD_DATE }}
          name: "HINLINK H28K 固件 ${{ env.RELEASE_TAG }} (${{ env.BUILD_DATE }})"
          body: |
            ## HINLINK H28K 固件

            - **编译日期**：${{ env.BUILD_DATE }}
            - **上游版本**：${{ env.RELEASE_TAG }} (${{ env.UPSTREAM_HASH }})
            - **设备型号**：HINLINK H28K (RK3528)
            - **管理地址**：`${{ env.FIRMWARE_LAN_IP }}`
            - **root 密码**：`${{ env.FIRMWARE_PASSWORD }}`
            - **内核 ABI**：`${{ env.KERNEL_ABI }}`
          files: source/bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传全量执行日志目录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译流程日志集
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 报告构建结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "HINLINK H28K build succeeded"
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/h28k-${{ env.RELEASE_TAG }}-${{ env.BUILD_DATE }}"
          elif [ "${{ job.status }}" = "failure" ]; then
            echo "Build failed; check the logs above"
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Build status: ${{ job.status }}"
          fi
