name: 使用 Docker ImageBuilder 打包 H28K 多格式固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'OpenWrt / ImmortalWrt 发布版本 Tag'
        required: true
        default: 'v25.12.1'
        type: choice
        options:
          - v25.12.1
          - v25.12.0
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0
      imagebuilder_strategy:
        description: 'ImageBuilder 镜像策略版本'
        required: true
        default: 'official-buildinfo-full'
        type: choice
        options:
          - official-buildinfo-full
          - official-buildbot-kernel-ib
          - kernel-strict
      rootfs_size:
        description: '初始根目录/系统分区大小 (MB)'
        required: true
        default: '2048'
        type: choice
        options:
          - '512'
          - '1024'
          - '2048'
          - '4096'
      include_third_party_pkgs:
        description: '额外编译并添加第三方 USB 驱动和 LuCI 插件主题'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  build-firmware:
    name: 打包 H28K (${{ inputs.target_tag }}, ${{ inputs.imagebuilder_strategy }}, ${{ inputs.rootfs_size }}MB)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前支持仓库
        uses: actions/checkout@v4

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 全局探测并锁定最快可用镜像源
        run: |
          set -euo pipefail
          
          RELEASE_VER="${{ inputs.target_tag }}"
          RELEASE_VER="${RELEASE_VER#v}"
          PATH_TARGET="releases/${RELEASE_VER}/targets/rockchip/armv8"

          MIRRORS=(
            "https://downloads.immortalwrt.org"
            "https://mirrors.ustc.edu.cn/immortalwrt"
            "https://mirrors.nju.edu.cn/immortalwrt"
            "https://mirrors.sjtug.sjtu.edu.cn/immortalwrt"
            "https://mirrors.tuna.tsinghua.edu.cn/immortalwrt"
            "https://mirrors.vsean.net/openwrt"
          )

          WORKING_MIRROR=""
          echo "=== 开始探测可用的 ImmortalWrt 镜像源 ==="
          for m in "${MIRRORS[@]}"; do
            echo "尝试探测源: ${m}/${PATH_TARGET}/sha256sums"
            if curl -fsSL --connect-timeout 4 --retry 0 "${m}/${PATH_TARGET}/sha256sums" -o /tmp/sha256sums; then
              WORKING_MIRROR="$m"
              echo "✅ 成功锁定首个可用源: [ ${WORKING_MIRROR} ]"
              break
            else
              echo "⚠️ 源连接超时或不可用，跳过: ${m}"
            fi
          done

          if [ -z "$WORKING_MIRROR" ]; then
            echo "❌ 错误：所有已知镜像源均无法连接！"
            exit 1
          fi

          echo "WORKING_MIRROR=${WORKING_MIRROR}" >> "$GITHUB_ENV"

      - name: 安装 SDK 宿主依赖环境
        if: ${{ inputs.include_third_party_pkgs }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-pip rsync swig python3-dev python3-setuptools

      - name: 宿主环境：下载 SDK 并增量编译第三方包
        if: ${{ inputs.include_third_party_pkgs }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extra-apks"

          RELEASE_VER="${{ inputs.target_tag }}"
          RELEASE_VER="${RELEASE_VER#v}"
          PATH_TARGET="releases/${RELEASE_VER}/targets/rockchip/armv8"

          # 1. 精准解析纯净的 SDK 文件名
          SDK_FILENAME=$(grep -E 'immortalwrt-sdk-.*rockchip-armv8.*' /tmp/sha256sums | awk '{print $2}' | sed 's/^\*//' | head -n1)
          echo "解析得到的纯净 SDK 文件名: [${SDK_FILENAME}]"

          # 2. 从已锁定的源直接下载 SDK
          echo "=== 从已锁定的源下载 SDK ==="
          curl -fsSL --connect-timeout 10 "${WORKING_MIRROR}/${PATH_TARGET}/${SDK_FILENAME}" -o /tmp/sdk_archive.tar

          mkdir -p /tmp/sdk
          tar -xf /tmp/sdk_archive.tar --strip-components=1 -C /tmp/sdk/

          # 3. 克隆第三方源码包
          echo "=== 克隆第三方源码包 ==="
          mkdir -p /tmp/sdk/package/custom
          git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-nikki.git /tmp/sdk/package/custom/luci-app-nikki
          git clone --depth 1 https://github.com/aijwfsibari/luci-theme-design.git /tmp/sdk/package/custom/luci-theme-design
          
          git clone --depth 1 https://github.com/LazuliKao/luci-theme-fluent.git /tmp/fluent_src
          if [ -d "/tmp/fluent_src/package/luci-theme-fluent" ]; then
            cp -r /tmp/fluent_src/package/luci-theme-fluent /tmp/sdk/package/custom/
          else
            cp -r /tmp/fluent_src /tmp/sdk/package/custom/luci-theme-fluent
          fi

          git clone --depth 1 https://github.com/morrownr/8821cu-20210916.git /tmp/sdk/package/custom/rtl8821cu
          git clone --depth 1 https://github.com/morrownr/88x2bu-20210702.git /tmp/sdk/package/custom/rtl88x2bu

          # 4. 使用 SDK 增量编译生成 .apk 包
          echo "=== 使用 SDK 增量编译生成 .apk 包 ==="
          cd /tmp/sdk
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1

          echo "CONFIG_PACKAGE_luci-app-nikki=m" >> .config
          echo "CONFIG_PACKAGE_luci-theme-design=m" >> .config
          echo "CONFIG_PACKAGE_luci-theme-fluent=m" >> .config
          echo "CONFIG_PACKAGE_kmod-rtl8821cu=m" >> .config
          echo "CONFIG_PACKAGE_kmod-rtl88x2bu=m" >> .config

          make defconfig >/dev/null 2>&1

          # 智能编译逻辑：多线程静默编译，失败则切换单线程排查；若最终仍失败则 exit 1 阻断退出
          for pkg in luci-app-nikki luci-theme-design luci-theme-fluent rtl8821cu rtl88x2bu; do
            echo ">>> [阶段 1] 正在启动多线程并行编译第三方包: $pkg (-j$(nproc))..."
            
            if make package/custom/$pkg/compile IGNORE_ERRORS=m -j$(nproc) >/dev/null 2>&1; then
              echo "✅ 包 [$pkg] 多线程编译成功！"
            else
              echo "--------------------------------------------------"
              echo "⚠️ 包 [$pkg] 多线程编译失败！切换到 [阶段 2] 单线程详细日志排查 ($pkg, V=s)..."
              echo "--------------------------------------------------"
              if ! make package/custom/$pkg/compile IGNORE_ERRORS=m -j1 V=s; then
                echo "❌ 错误：包 [$pkg] 编译彻底失败！阻断构建程序！"
                exit 1
              fi
            fi
          done

          find bin/packages/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp -av {} "$GITHUB_WORKSPACE/extra-apks/" \; 2>/dev/null || true
          echo "=== 宿主环境最终生成的 extra-apks 列表 ==="
          ls -la "$GITHUB_WORKSPACE/extra-apks/"

      - name: 运行 Docker ImageBuilder 容器打包固件 (Squashfs + ext4 + LXC)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/h28k-imagebuilder:${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}
          INCLUDE_THIRD_PARTY: ${{ inputs.include_third_party_pkgs }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_size }}
          WORKING_MIRROR: ${{ env.WORKING_MIRROR }}
        run: |
          set -euo pipefail
          mkdir -p output files

          BASE_PACKAGES=(
            luci-app-diskman
            luci-app-dockerman
            dockerd
            luci-app-openclash
            wpad-openssl
            openssh-sftp-server
            wireless-regdb
            kmod-mt7921u
            kmod-rtl8812au-ct
            kmod-rtl8192cu
            kmod-rtl8188eu
            kmod-mt7601u
            kmod-mt76x2u
            rtl8192cu-firmware
          )

          if [ "$INCLUDE_THIRD_PARTY" = "true" ]; then
            EXTRA_PACKAGES=(
              luci-app-nikki
              luci-theme-design
              luci-theme-fluent
              kmod-rtl8821cu
              kmod-rtl88x2bu
            )
            ALL_PACKAGES=("${BASE_PACKAGES[@]}" "${EXTRA_PACKAGES[@]}")
          else
            ALL_PACKAGES=("${BASE_PACKAGES[@]}")
          fi

          PACKAGES_STR="${ALL_PACKAGES[*]}"

          DOCKER_RUN_ARGS=(
            --rm
            -e "PACKAGES=$PACKAGES_STR"
            -e "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE"
            -e "WORKING_MIRROR=$WORKING_MIRROR"
            -v "$GITHUB_WORKSPACE/output:/output"
            -v "$GITHUB_WORKSPACE/files:/home/builder/imagebuilder/files:ro"
          )

          if [ "$INCLUDE_THIRD_PARTY" = "true" ] && [ -d "$GITHUB_WORKSPACE/extra-apks" ]; then
            DOCKER_RUN_ARGS+=(-v "$GITHUB_WORKSPACE/extra-apks:/home/builder/imagebuilder/packages/extra:ro")
          fi

          docker run "${DOCKER_RUN_ARGS[@]}" "$IMAGE_NAME" '
            set -euo pipefail
            
            if [ -n "$WORKING_MIRROR" ] && [ -f repositories.conf ]; then
              echo "=== 正在将 ImageBuilder 软件源替换为锁定源: $WORKING_MIRROR ==="
              sed -i "s|https://downloads.immortalwrt.org|$WORKING_MIRROR|g" repositories.conf || true
            fi

            if [ -d packages/extra ]; then
              cp -av packages/extra/* packages/ 2>/dev/null || true
            fi

            make image PROFILE=hinlink_h28k \
              PACKAGES="$PACKAGES" \
              FILES=files \
              ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
              CONFIG_TARGET_ROOTFS_SQUASHFS=y \
              CONFIG_TARGET_ROOTFS_EXT4FS=y \
              CONFIG_TARGET_ROOTFS_TARGZ=y

            mkdir -p /output
            cp -av bin/targets/rockchip/armv8/*hinlink*h28k* /output/ || true
            cp -av bin/targets/rockchip/armv8/*rootfs*.tar.gz /output/ || true
            [ -f profiles.json ] && cp -av profiles.json /output/profiles.json || true
          '

      - name: 校验固件 ABI 一致性
        env:
          WORKING_MIRROR: ${{ env.WORKING_MIRROR }}
        run: |
          set -euo pipefail
          
          BUILT_ABI=$(jq -r '.linux_kernel.vermagic // empty' output/profiles.json)
          VERSION="${{ inputs.target_tag }}"
          VERSION="${VERSION#v}"
          
          TARGET_MIRROR="${WORKING_MIRROR:-https://downloads.immortalwrt.org}"
          echo "正在从锁定源获取 profiles.json: ${TARGET_MIRROR}"
          OFFICIAL_ABI=$(curl -fsSL --connect-timeout 5 "${TARGET_MIRROR}/releases/${VERSION}/targets/rockchip/armv8/profiles.json" | jq -r '.linux_kernel.vermagic // empty')

          echo "=================================================="
          echo "打包固件内核 ABI (vermagic): $BUILT_ABI"
          echo "官方 Release 内核 ABI (vermagic): $OFFICIAL_ABI"
          echo "=================================================="

          echo "### 固件内核 ABI 校验结果" >> $GITHUB_STEP_SUMMARY
          echo "- **打包固件 ABI**: \`$BUILT_ABI\`" >> $GITHUB_STEP_SUMMARY
          echo "- **官方 Release ABI**: \`$OFFICIAL_ABI\`" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUILT_ABI" ] && [ "$BUILT_ABI" = "$OFFICIAL_ABI" ]; then
            echo "✅ **结论**: 打包固件的内核 ABI 与官方 100% 对齐！" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **结论**: 警告！固件 ABI 与官方不匹配！" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 获取编译日期
        run: echo "BUILD_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: 上传固件产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h28k-${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}-${{ env.BUILD_DATE }}-${{ inputs.rootfs_size }}M
          path: |
            output/*hinlink*h28k*
            output/*rootfs*.tar.gz
            output/profiles.json
          retention-days: 14
