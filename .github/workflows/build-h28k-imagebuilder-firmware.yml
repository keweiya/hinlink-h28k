name: 使用 Docker ImageBuilder 打包 H28K 多格式固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'OpenWrt / ImmortalWrt 发布版本 Tag'
        required: true
        default: 'v25.12.1'
        type: choice
        options:
          - v25.12.1
          - v25.12.0
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0
      imagebuilder_strategy:
        description: 'ImageBuilder 镜像策略版本'
        required: true
        default: 'official-buildinfo-full'
        type: choice
        options:
          - official-buildinfo-full
          - official-buildbot-kernel-ib
          - kernel-strict
      rootfs_size:
        description: '初始根目录/系统分区大小 (MB)'
        required: true
        default: '2048'
        type: choice
        options:
          - '512'
          - '1024'
          - '2048'
          - '4096'
      include_third_party_pkgs:
        description: '额外编译并添加第三方 USB 驱动和 LuCI 插件主题'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  build-firmware:
    name: 打包 H28K (${{ inputs.target_tag }}, ${{ inputs.imagebuilder_strategy }}, ${{ inputs.rootfs_size }}MB)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前支持仓库
        uses: actions/checkout@v4

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 宿主环境：下载 SDK 并增量编译第三方源码为 .apk
        if: ${{ inputs.include_third_party_pkgs }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extra-apks"

          RELEASE_VER="${{ inputs.target_tag }}"
          RELEASE_VER="${RELEASE_VER#v}"
          
          echo "=== 1. 宿主环境：获取并解压官方 SDK (${RELEASE_VER}) ==="
          BASE_URL="https://downloads.immortalwrt.org/releases/${RELEASE_VER}/targets/rockchip/armv8"
          
          # 动态匹配 SDK 文件名（处理 .tar.xz 或 .tar.zst 压缩格式）
          SDK_FILENAME=$(curl -fsSL "$BASE_URL/sha256sums" | grep -E 'immortalwrt-sdk-.*rockchip-armv8.*' | awk '{print $2}' | head -n1)
          
          if [ -z "$SDK_FILENAME" ]; then
            echo "错误：无法在官方源找到对应的 SDK 包！"
            exit 1
          fi

          echo "下载 SDK: $SDK_FILENAME"
          curl -fsSL "$BASE_URL/$SDK_FILENAME" -o /tmp/sdk_archive
          mkdir -p /tmp/sdk
          tar -xf /tmp/sdk_archive --strip-components=1 -C /tmp/sdk/

          echo "=== 2. 克隆第三方插件与驱动源码 ==="
          mkdir -p /tmp/sdk/package/custom

          git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-nikki.git /tmp/sdk/package/custom/luci-app-nikki || true
          git clone --depth 1 https://github.com/aijwfsibari/luci-theme-design.git /tmp/sdk/package/custom/luci-theme-design || true
          
          git clone --depth 1 https://github.com/LazuliKao/luci-theme-fluent.git /tmp/fluent_src || true
          if [ -d "/tmp/fluent_src/package/luci-theme-fluent" ]; then
            cp -r /tmp/fluent_src/package/luci-theme-fluent /tmp/sdk/package/custom/
          else
            cp -r /tmp/fluent_src /tmp/sdk/package/custom/luci-theme-fluent || true
          fi

          git clone --depth 1 https://github.com/morrownr/8821cu-20210916.git /tmp/sdk/package/custom/rtl8821cu || true
          git clone --depth 1 https://github.com/morrownr/88x2bu-20210702.git /tmp/sdk/package/custom/rtl88x2bu || true

          echo "=== 3. 使用 SDK 增量编译生成 .apk 软件包 ==="
          cd /tmp/sdk
          
          # 更新 feeds（确保依赖齐全）
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true

          # 开启包配置为模块 (=m)
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci-app-nikki=m
          CONFIG_PACKAGE_luci-theme-design=m
          CONFIG_PACKAGE_luci-theme-fluent=m
          CONFIG_PACKAGE_kmod-rtl8821cu=m
          CONFIG_PACKAGE_kmod-rtl88x2bu=m
          EOF

          make defconfig

          # 执行独立增量编译
          for pkg in luci-app-nikki luci-theme-design luci-theme-fluent rtl8821cu rtl88x2bu; do
            echo "----------------------------------------"
            echo "正在 SDK 中编译: $pkg"
            echo "----------------------------------------"
            make "package/custom/$pkg/compile" V=s -j$(nproc) || true
          done

          echo "=== 4. 收集编译好的 .apk 包 ==="
          find bin/packages/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp -av {} "$GITHUB_WORKSPACE/extra-apks/" \; 2>/dev/null || true
          
          echo "=== 宿主编译出来的 APK 清单 ==="
          ls -la "$GITHUB_WORKSPACE/extra-apks/"

      - name: 运行 Docker ImageBuilder 容器打包固件 (Squashfs + ext4 + LXC)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/h28k-imagebuilder:${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}
          INCLUDE_THIRD_PARTY: ${{ inputs.include_third_party_pkgs }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail
          mkdir -p output files

          echo "=== 使用的 ImageBuilder 镜像名称 ==="
          echo "IMAGE_NAME=$IMAGE_NAME"

          # 1. 默认必装的官方仓库插件与驱动
          BASE_PACKAGES=(
            luci-app-diskman
            luci-app-dockerman
            dockerd
            luci-app-openclash
            wpad-openssl
            openssh-sftp-server
            wireless-regdb
            kmod-mt7921u
            kmod-rtl8812au-ct
            kmod-rtl8192cu
            kmod-rtl8188eu
            kmod-mt7601u
            kmod-mt76x2u
            rtl8192cu-firmware
          )

          # 2. 如果开启第三方开关，追加额外包
          if [ "$INCLUDE_THIRD_PARTY" = "true" ]; then
            EXTRA_PACKAGES=(
              luci-app-nikki
              luci-theme-design
              luci-theme-fluent
              kmod-rtl8821cu
              kmod-rtl88x2bu
            )
            ALL_PACKAGES=("${BASE_PACKAGES[@]}" "${EXTRA_PACKAGES[@]}")
          else
            ALL_PACKAGES=("${BASE_PACKAGES[@]}")
          fi

          PACKAGES_STR="${ALL_PACKAGES[*]}"
          echo "=== 拟安装软件包列表 ==="
          echo "$PACKAGES_STR"

          # 3. 构造 Docker 运行参数（挂载宿主编译好的 extra-apks）
          DOCKER_RUN_ARGS=(
            --rm
            -e "PACKAGES=$PACKAGES_STR"
            -e "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE"
            -v "$GITHUB_WORKSPACE/output:/output"
            -v "$GITHUB_WORKSPACE/files:/home/builder/imagebuilder/files:ro"
          )

          if [ "$INCLUDE_THIRD_PARTY" = "true" ] && [ -d "$GITHUB_WORKSPACE/extra-apks" ]; then
            DOCKER_RUN_ARGS+=(-v "$GITHUB_WORKSPACE/extra-apks:/home/builder/imagebuilder/packages/extra:ro")
          fi

          docker run "${DOCKER_RUN_ARGS[@]}" "$IMAGE_NAME" '
            set -euo pipefail
            echo "=== 开始使用 ImageBuilder 打包多格式固件 ==="
            echo "RootFS 大小: ${ROOTFS_PARTSIZE} MB"
            echo "软件包: $PACKAGES"

            # 同步宿主机 SDK 编译出的 APK 并更新本地索引
            if [ -d packages/extra ]; then
              echo "检测到宿主机 SDK 编译的第三方包，建立本地索引..."
              cp -av packages/extra/* packages/ 2>/dev/null || true
            fi

            # 打包固件：开启 Squashfs, ext4 以及 LXC (tar.gz) 构建
            make image PROFILE=hinlink_h28k \
              PACKAGES="$PACKAGES" \
              FILES=files \
              ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
              CONFIG_TARGET_ROOTFS_SQUASHFS=y \
              CONFIG_TARGET_ROOTFS_EXT4FS=y \
              CONFIG_TARGET_ROOTFS_TARGZ=y

            # 收集生成的镜像和 Profiles 元数据
            mkdir -p /output
            cp -av bin/targets/rockchip/armv8/*hinlink*h28k* /output/ || true
            cp -av bin/targets/rockchip/armv8/*rootfs*.tar.gz /output/ || true
            [ -f profiles.json ] && cp -av profiles.json /output/profiles.json || true
          '

      - name: 输出并校验固件 ABI 一致性
        run: |
          set -euo pipefail
          
          BUILT_ABI=$(jq -r '.linux_kernel.vermagic // empty' output/profiles.json)
          
          VERSION="${{ inputs.target_tag }}"
          VERSION="${VERSION#v}"
          OFFICIAL_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/rockchip/armv8/profiles.json"
          OFFICIAL_ABI=$(curl -fsSL "$OFFICIAL_URL" | jq -r '.linux_kernel.vermagic // empty')

          echo "=================================================="
          echo "打包固件内核 ABI (vermagic): $BUILT_ABI"
          echo "官方 Release 内核 ABI (vermagic): $OFFICIAL_ABI"
          echo "=================================================="

          echo "### 固件内核 ABI 校验结果" >> $GITHUB_STEP_SUMMARY
          echo "- **打包固件 ABI**: \`$BUILT_ABI\`" >> $GITHUB_STEP_SUMMARY
          echo "- **官方 Release ABI**: \`$OFFICIAL_ABI\`" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUILT_ABI" ] && [ "$BUILT_ABI" = "$OFFICIAL_ABI" ]; then
            echo "✅ **结论**: 打包固件的内核 ABI 与官方 100% 对齐，可正常在线安装所有官方 \`kmod-*\` 模块！" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **结论**: 警告！固件 ABI 与官方不匹配，在线安装 \`kmod-*\` 可能会提示 ABI mismatch！" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 获取编译日期
        run: echo "BUILD_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: 上传固件产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h28k-${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}-${{ env.BUILD_DATE }}-${{ inputs.rootfs_size }}M
          path: |
            output/*hinlink*h28k*
            output/*rootfs*.tar.gz
            output/profiles.json
          retention-days: 14
