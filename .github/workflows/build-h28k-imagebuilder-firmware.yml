name: 使用 Docker ImageBuilder 打包 H28K 多格式固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'OpenWrt / ImmortalWrt 发布版本 Tag'
        required: true
        default: 'v25.12.1'
        type: choice
        options:
          - v25.12.1
          - v25.12.0
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0
      imagebuilder_strategy:
        description: 'ImageBuilder 镜像策略版本'
        required: true
        default: 'official-buildinfo-full'
        type: choice
        options:
          - official-buildinfo-full
          - official-buildbot-kernel-ib
          - kernel-strict
      rootfs_size:
        description: '初始根目录/系统分区大小 (MB)'
        required: true
        default: '2048'
        type: choice
        options:
          - '512'
          - '1024'
          - '2048'
          - '4096'
      include_third_party_pkgs:
        description: '额外编译并添加第三方 USB 驱动与 LuCI 插件/主题'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  build-firmware:
    name: 打包 H28K (${{ inputs.target_tag }}, ${{ inputs.imagebuilder_strategy }}, ${{ inputs.rootfs_size }}MB)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前支持仓库
        uses: actions/checkout@v4

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行 Docker ImageBuilder 容器连贯执行【源码编译 + 固件打包】
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/h28k-imagebuilder:${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}
          INCLUDE_THIRD_PARTY: ${{ inputs.include_third_party_pkgs }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_size }}
        run: |
          set -euo pipefail
          mkdir -p output files

          echo "=== 使用的 ImageBuilder 镜像名称 ==="
          echo "IMAGE_NAME=$IMAGE_NAME"

          # 1. 默认必装的官方仓库插件与驱动
          BASE_PACKAGES=(
            luci-app-diskman
            luci-app-dockerman
            dockerd
            luci-app-openclash
            wpad-openssl
            openssh-sftp-server
            wireless-regdb
            kmod-mt7921u
            kmod-rtl8812au-ct
            kmod-rtl8192cu
            kmod-rtl8188eu
            kmod-mt7601u
            kmod-mt76x2u
            rtl8192cu-firmware
          )

          # 2. 如果开启第三方开关，追加额外包
          if [ "$INCLUDE_THIRD_PARTY" = "true" ]; then
            EXTRA_PACKAGES=(
              luci-app-nikki
              luci-theme-design
              luci-theme-fluent
              kmod-rtl8821cu
              kmod-rtl88x2bu
            )
            ALL_PACKAGES=("${BASE_PACKAGES[@]}" "${EXTRA_PACKAGES[@]}")
          else
            ALL_PACKAGES=("${BASE_PACKAGES[@]}")
          fi

          PACKAGES_STR="${ALL_PACKAGES[*]}"
          echo "=== 拟安装软件包列表 ==="
          echo "$PACKAGES_STR"

          # 3. 构造 Docker 运行参数
          DOCKER_RUN_ARGS=(
            --rm
            -e "PACKAGES=$PACKAGES_STR"
            -e "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE"
            -e "INCLUDE_THIRD_PARTY=$INCLUDE_THIRD_PARTY"
            -v "$GITHUB_WORKSPACE/output:/output"
            -v "$GITHUB_WORKSPACE/files:/home/builder/imagebuilder/files:ro"
          )

          docker run "${DOCKER_RUN_ARGS[@]}" "$IMAGE_NAME" '
            set -euo pipefail

            if [ "$INCLUDE_THIRD_PARTY" = "true" ]; then
              echo "=== 1. 正在 Docker 容器内克隆第三方插件与驱动源码 ==="
              mkdir -p package/custom

              git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-nikki.git package/custom/luci-app-nikki || true
              git clone --depth 1 https://github.com/aijwfsibari/luci-theme-design.git package/custom/luci-theme-design || true
              
              # Fluent 主题处理子目录
              git clone --depth 1 https://github.com/LazuliKao/luci-theme-fluent.git /tmp/luci-theme-fluent || true
              if [ -d "/tmp/luci-theme-fluent/package/luci-theme-fluent" ]; then
                cp -r /tmp/luci-theme-fluent/package/luci-theme-fluent package/custom/
              else
                cp -r /tmp/luci-theme-fluent package/custom/luci-theme-fluent || true
              fi

              # USB 驱动源码
              git clone --depth 1 https://github.com/morrownr/8821cu-20210916.git package/custom/rtl8821cu || true
              git clone --depth 1 https://github.com/morrownr/88x2bu-20210702.git package/custom/rtl88x2bu || true

              echo "=== 2. 增量编译第三方软件包生成 .apk ==="
              # 如果容器内具备 OpenWrt 编译环境（如 SDK/Build 目录），执行增量 compile
              if [ -f "scripts/feeds" ] || [ -f "Makefile" ]; then
                for pkg_dir in package/custom/*; do
                  [ -d "$pkg_dir" ] || continue
                  echo "正在编译第三方包: $(basename "$pkg_dir")..."
                  make "package/custom/$(basename "$pkg_dir")/compile" V=s || true
                done
                
                echo "=== 3. 将编译好的 .apk 自动同步并建立本地索引 ==="
                mkdir -p packages
                find bin/packages/ -type f -name "*.apk" -exec cp -av {} packages/ \; 2>/dev/null || true
              fi
            fi

            echo "=== 4. 开始使用 ImageBuilder 打包多格式固件 ==="
            echo "RootFS 大小: ${ROOTFS_PARTSIZE} MB"
            echo "软件包: $PACKAGES"

            # 执行打包：开启 Squashfs, ext4 以及 LXC (tar.gz) 构建
            make image PROFILE=hinlink_h28k \
              PACKAGES="$PACKAGES" \
              FILES=files \
              ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
              CONFIG_TARGET_ROOTFS_SQUASHFS=y \
              CONFIG_TARGET_ROOTFS_EXT4FS=y \
              CONFIG_TARGET_ROOTFS_TARGZ=y

            # 收集生成的镜像与 Profiles 元数据
            mkdir -p /output
            cp -av bin/targets/rockchip/armv8/*hinlink*h28k* /output/ || true
            cp -av bin/targets/rockchip/armv8/*rootfs*.tar.gz /output/ || true
            [ -f profiles.json ] && cp -av profiles.json /output/profiles.json || true
          '

      - name: 输出并校验固件 ABI 一致性
        run: |
          set -euo pipefail
          
          # 1. 读取打包出的 profiles.json 中的 ABI
          BUILT_ABI=$(jq -r '.linux_kernel.vermagic // empty' output/profiles.json)
          
          # 2. 从官方源动态读取对应 Tag 的 ABI
          VERSION="${{ inputs.target_tag }}"
          VERSION="${VERSION#v}"
          OFFICIAL_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/rockchip/armv8/profiles.json"
          OFFICIAL_ABI=$(curl -fsSL "$OFFICIAL_URL" | jq -r '.linux_kernel.vermagic // empty')

          echo "=================================================="
          echo "打包固件内核 ABI (vermagic): $BUILT_ABI"
          echo "官方 Release 内核 ABI (vermagic): $OFFICIAL_ABI"
          echo "=================================================="

          # 3. 写入 GitHub Actions 日志面板 Summary
          echo "### 固件内核 ABI 校验结果" >> $GITHUB_STEP_SUMMARY
          echo "- **打包固件 ABI**: \`$BUILT_ABI\`" >> $GITHUB_STEP_SUMMARY
          echo "- **官方 Release ABI**: \`$OFFICIAL_ABI\`" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUILT_ABI" ] && [ "$BUILT_ABI" = "$OFFICIAL_ABI" ]; then
            echo "✅ **结论**: 打包固件的内核 ABI 与官方 100% 对齐，可正常在线安装所有官方 \`kmod-*\` 模块！" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **结论**: 警告！固件 ABI 与官方不匹配，在线安装 \`kmod-*\` 可能会提示 ABI mismatch！" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 获取编译日期
        run: echo "BUILD_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: 上传固件产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h28k-${{ inputs.target_tag }}-${{ inputs.imagebuilder_strategy }}-${{ env.BUILD_DATE }}-${{ inputs.rootfs_size }}M
          path: |
            output/*hinlink*h28k*
            output/*rootfs*.tar.gz
            output/profiles.json
          retention-days: 14
