name: 全量无损压缩增量缓存镜像 (宿主机挂载压缩版)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: '源镜像 Tag (如 v25.12.1)'
        required: true
        default: 'v25.12.1'
        type: string
      target_tag:
        description: '压缩后保存的新镜像 Tag (如 v25.12.1-compressed)'
        required: true
        default: 'v25.12.1-compressed'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  compress-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      SRC_IMAGE: ghcr.io/${{ github.repository_owner }}/h28k-build-cache:${{ inputs.source_tag }}
      NEW_IMAGE: ghcr.io/${{ github.repository_owner }}/h28k-build-cache:${{ inputs.target_tag }}

    steps:
      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装宿主机压缩工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd tar

      - name: 拉取源镜像并导出数据到宿主机
        run: |
          set -euo pipefail
          echo "=== 1.1 拉取源镜像: ${{ env.SRC_IMAGE }} ==="
          docker pull ${{ env.SRC_IMAGE }}

          echo "=== 1.2 创建临时容器并导出 /builder/source 数据 ==="
          mkdir -p "$GITHUB_WORKSPACE/host_build"
          
          # 创建一次性容器（不启动）
          docker create --name extractor_container ${{ env.SRC_IMAGE }}

          # 将容器内的 /builder 目录完整复制到宿主机
          echo ">>> 正在从容器复制文件到宿主机..."
          docker cp extractor_container:/builder "$GITHUB_WORKSPACE/host_build/"

          # 彻底销毁提取用的容器
          docker rm extractor_container

          echo "=== 1.3 检查宿主机上的原始数据大小 ==="
          du -sh "$GITHUB_WORKSPACE/host_build/builder/source"

      - name: 在宿主机上执行全量 Zstd 并发压缩
        run: |
          set -euo pipefail
          echo "=== 2.1 开始在宿主机上使用多线程压缩 (zstd -T0) ==="
          
          # 创建打包准备目录
          mkdir -p "$GITHUB_WORKSPACE/docker_build_context/builder"

          # 利用宿主机多核 CPU (-T0) 极速打包压缩
          tar --zstd -cf "$GITHUB_WORKSPACE/docker_build_context/builder/source_cache.tar.zst" \
            -C "$GITHUB_WORKSPACE/host_build/builder/source" .

          echo "=== 2.2 压缩包生成完成，核验大小 ==="
          ls -lh "$GITHUB_WORKSPACE/docker_build_context/builder/source_cache.tar.zst"
          du -sh "$GITHUB_WORKSPACE/docker_build_context/builder/source_cache.tar.zst"

          echo "=== 2.3 清理宿主机展开的解压源数据（释放 Runner 磁盘空间） ==="
          rm -rf "$GITHUB_WORKSPACE/host_build"

      - name: 数据核验与结构检查
        run: |
          set -euo pipefail
          TAR_FILE="$GITHUB_WORKSPACE/docker_build_context/builder/source_cache.tar.zst"
          echo "=== 3.1 验证 bin/ 产物与 .git 目录是否完好包含在压缩包中 ==="
          
          echo "Checking .git..."
          tar --zstd -tf "$TAR_FILE" | grep -E "^\./\.git/" | head -n 5 || true
          
          echo "Checking bin/..."
          tar --zstd -tf "$TAR_FILE" | grep -E "^\./bin/" | head -n 5 || true
          
          echo "Checking tools/ & toolchain/..."
          tar --zstd -tf "$TAR_FILE" | grep -E "^\./(tools|toolchain)/" | head -n 5 || true

      - name: 基于 Dockerfile 重新构建纯净镜像 (单层 Flatten)
        run: |
          set -euo pipefail
          echo "=== 4.1 生成 Dockerfile ==="
          
          # 制作基于基础镜像的干净构建环境，只复制压缩包，彻底摆脱 11G 旧层
          cat << EOF > "$GITHUB_WORKSPACE/docker_build_context/Dockerfile"
          FROM ${{ env.SRC_IMAGE }}
          
          # 删除镜像自带的原解压目录
          RUN rm -rf /builder/source
          
          # 将压缩好的 source_cache.tar.zst 写入新层
          COPY builder/source_cache.tar.zst /builder/source_cache.tar.zst
          EOF

          echo "=== 4.2 重新构建镜像 ==="
          docker build -t ${{ env.NEW_IMAGE }} "$GITHUB_WORKSPACE/docker_build_context"

      - name: 推送新镜像到 GHCR
        run: |
          set -euo pipefail
          echo "正在推送新镜像: ${{ env.NEW_IMAGE }}..."
          docker push ${{ env.NEW_IMAGE }}

          echo "=================================================="
          echo "✅ 单层全量压缩镜像已发布至: ${{ env.NEW_IMAGE }}"
          echo "=================================================="

      - name: 清理 Runner 本地临时环境与镜像
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/host_build" "$GITHUB_WORKSPACE/docker_build_context" 2>/dev/null || true
          docker system prune -af || true
