name: 构建定制版 H28K ImageBuilder 镜像并编译固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'ImmortalWrt release tag (如 v25.12.1)'
        required: true
        default: 'v25.12.1'
        type: choice
        options:
          - v25.12.1
          - v25.12.0
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0
      rootfs_partsize:
        description: 'RootFS 分区大小'
        required: true
        default: '2G'
        type: choice
        options:
          - 512M
          - 1G
          - 2G
          - 4G
      upload_release:
        description: '发布最终固件到 GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: h28k-custom-imagebuilder-${{ github.ref }}-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  build-ib-and-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 检出 H28K 支持仓库
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析版本与多源连通性测试
        id: release
        run: |
          set -euo pipefail
          TAG='${{ inputs.target_tag }}'
          VERSION="${TAG#v}"
          
          # 多源回退策略测试最佳镜像源
          MIRRORS=(
            "https://downloads.immortalwrt.org"
            "https://mirrors.ustc.edu.cn/immortalwrt"
            "https://mirrors.nju.edu.cn/immortalwrt"
            "https://mirrors.sjtug.sjtu.edu.cn/immortalwrt"
          )
          
          WORKING_MIRROR=""
          PATH_TARGET="releases/${VERSION}/targets/rockchip/armv8"
          
          for m in "${MIRRORS[@]}"; do
            echo "尝试连通: ${m}/${PATH_TARGET}/sha256sums"
            if curl -fsSL --connect-timeout 5 "${m}/${PATH_TARGET}/sha256sums" -o /tmp/sha256sums; then
              WORKING_MIRROR="$m"
              echo "✅ 成功锁定镜像源: $WORKING_MIRROR"
              break
            fi
          done
          
          if [ -z "$WORKING_MIRROR" ]; then
            echo "❌ 错误：所有镜像源均无法连接！"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "working_mirror=${WORKING_MIRROR}" >> "$GITHUB_OUTPUT"
          echo "base_url=${WORKING_MIRROR}/${PATH_TARGET}" >> "$GITHUB_OUTPUT"

      - name: 安装 SDK 编译宿主环境依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-pip rsync swig python3-dev python3-setuptools time

      - name: 下载官方 SDK 与 ImageBuilder，并本地编译第三方插件
        run: |
          set -euo pipefail
          BASE_URL='${{ steps.release.outputs.base_url }}'
          
          # 1. 下载 ImageBuilder 官方压缩包
          IB_FILENAME=$(grep -E 'immortalwrt-imagebuilder-.*rockchip-armv8.*' /tmp/sha256sums | awk '{print $2}' | sed 's/^\*//' | head -n1)
          echo "下载 ImageBuilder: $IB_FILENAME"
          curl -fsSL "${BASE_URL}/${IB_FILENAME}" -o /tmp/ib.tar.xz
          
          mkdir -p /tmp/imagebuilder
          tar -xf /tmp/ib.tar.xz --strip-components=1 -C /tmp/imagebuilder/

          # 2. 下载 SDK 压缩包用于编译第三方包
          SDK_FILENAME=$(grep -E 'immortalwrt-sdk-.*rockchip-armv8.*' /tmp/sha256sums | awk '{print $2}' | sed 's/^\*//' | head -n1)
          echo "下载 SDK: $SDK_FILENAME"
          curl -fsSL "${BASE_URL}/${SDK_FILENAME}" -o /tmp/sdk.tar.xz
          
          mkdir -p /tmp/sdk
          tar -xf /tmp/sdk.tar.xz --strip-components=1 -C /tmp/sdk/

          # 3. 克隆第三方源码包 (Nikki + Design 主题 + Fluent 主题)
          echo "=== 克隆第三方插件源码 ==="
          mkdir -p /tmp/sdk/package/custom
          git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-nikki.git /tmp/sdk/package/custom/nikki
          git clone --depth 1 https://github.com/aijwfsibari/luci-theme-design.git /tmp/sdk/package/custom/luci-theme-design
          
          git clone --depth 1 https://github.com/LazuliKao/luci-theme-fluent.git /tmp/fluent_src
          if [ -d "/tmp/fluent_src/package/luci-theme-fluent" ]; then
            cp -r /tmp/fluent_src/package/luci-theme-fluent /tmp/sdk/package/custom/
          else
            cp -r /tmp/fluent_src /tmp/sdk/package/custom/luci-theme-fluent
          fi

          # 4. 在 SDK 中增量编译
          echo "=== 开始编译第三方包 ==="
          cd /tmp/sdk
          ./scripts/feeds update -i >/dev/null 2>&1 || true
          
          echo "CONFIG_PACKAGE_nikki=m" >> .config
          echo "CONFIG_PACKAGE_luci-theme-design=m" >> .config
          echo "CONFIG_PACKAGE_luci-theme-fluent=m" >> .config
          make defconfig >/dev/null 2>&1 || true

          for pkg in nikki luci-theme-design luci-theme-fluent; do
            echo "正在编译: $pkg"
            make "package/custom/$pkg/compile" IGNORE_ERRORS=m -j$(nproc) || make "package/custom/$pkg/compile" IGNORE_ERRORS=m -j1 V=s
          done

          # 5. 将编译出来的 .apk 注入到 ImageBuilder 的 packages 目录中
          echo "=== 注入编译产物到 ImageBuilder ==="
          mkdir -p /tmp/imagebuilder/packages
          find bin/packages/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp -av {} /tmp/imagebuilder/packages/ \;

          # 6. 保存为自定义的 Docker 镜像并推送至 GHCR
          echo "=== 构建定制版 ImageBuilder Docker 镜像 ==="
          cd /tmp/imagebuilder
          
          # 创建一个简易的 Dockerfile 封装该目录
          cat << 'EOF' > Dockerfile
          FROM alpine:latest
          RUN apk add --no-cache bash make perl tar gzip findutils coreutils diffutils wget python3
          WORKDIR /home/builder/imagebuilder
          COPY . /home/builder/imagebuilder/
          CMD ["/bin/bash"]
          EOF

          CUSTOM_IMAGE="ghcr.io/${{ github.repository_owner }}/h28k-custom-imagebuilder:${{ steps.release.outputs.version }}"
          docker build -t "$CUSTOM_IMAGE" .
          docker push "$CUSTOM_IMAGE"
          echo "custom_image=$CUSTOM_IMAGE" >> $GITHUB_ENV

      - name: 校验官方与自定义镜像的 Kernel ABI
        id: official
        run: |
          set -euo pipefail
          BASE_URL='${{ steps.release.outputs.base_url }}'
          curl -fsSL "$BASE_URL/profiles.json" -o /tmp/profiles.json
          curl -fsSL "$BASE_URL/packages/index.json" -o /tmp/index.json
          
          official_abi="$(jq -r '.linux_kernel.vermagic // empty' /tmp/profiles.json)"
          official_kernel="$(jq -r '.packages.kernel' /tmp/index.json)"
          
          echo "official_kernel=$official_kernel" >> "$GITHUB_OUTPUT"
          echo "official_abi=$official_abi" >> "$GITHUB_OUTPUT"
          echo "Official Kernel ABI: $official_abi"

      - name: 准备固件打包参数与 files
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p output files/etc/uci-defaults
          
          # 组装 packages 列表（包含默认文件包 + 第三方插件 nikki、主题）
          PACKAGES="$(grep -Ev '^[[:space:]]*(#|$)' config/h28k-firmware.packages | tr '\n' ' ' | xargs)"
          EXTRA="${{ inputs.extra_packages }}"
          # 自动挂载刚刚编译好的第三方包
          PACKAGES="${PACKAGES} ${EXTRA} nikki luci-theme-design luci-theme-fluent"
          
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"

          case '${{ inputs.rootfs_partsize }}' in
            512M) ROOTFS_PARTSIZE=512 ;;
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
          esac
          echo "rootfs_partsize=${ROOTFS_PARTSIZE}" >> "$GITHUB_OUTPUT"

          LAN_IP="$(sed -n 's/^lan_ip=//p' config/firmware.conf | tail -n1)"
          DEFAULT_THEME="$(sed -n 's/^default_theme=//p' config/firmware.conf | tail -n1)"
          cat > files/etc/uci-defaults/99-h28k-custom <<EOF
          #!/bin/sh
          set -e
          [ -n "${LAN_IP}" ] && uci set network.lan.ipaddr='${LAN_IP}' || true
          [ -n "${DEFAULT_THEME}" ] && uci set luci.main.mediaurlbase='/luci-static/${DEFAULT_THEME}' || true
          uci commit network || true
          uci commit luci || true
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-h28k-custom

      - name: 使用自建镜像执行 ImageBuilder 打包 H28K 固件
        run: |
          set -euo pipefail
          docker run --rm \
            -e PACKAGES='${{ steps.prepare.outputs.packages }}' \
            -e ROOTFS_PARTSIZE='${{ steps.prepare.outputs.rootfs_partsize }}' \
            -e WORKING_MIRROR='${{ steps.release.outputs.working_mirror }}' \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -v "$GITHUB_WORKSPACE/files:/home/builder/imagebuilder/files:ro" \
            "$custom_image" '
              set -euo pipefail
              
              # 替换软件源为当前测得最快的镜像源
              if [ -n "$WORKING_MIRROR" ] && [ -f repositories.conf ]; then
                sed -i "s|https://downloads.immortalwrt.org|$WORKING_MIRROR|g" repositories.conf || true
              fi

              echo "=== 开始打包固件 ==="
              make image PROFILE=hinlink_h28k PACKAGES="$PACKAGES" FILES=files ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
                CONFIG_TARGET_ROOTFS_SQUASHFS=y CONFIG_TARGET_ROOTFS_EXT4FS=y CONFIG_TARGET_ROOTFS_TARGZ=y

              mkdir -p /output
              cp -av bin/targets/rockchip/armv8/*hinlink*h28k* /output/ || true
              cp -av bin/targets/rockchip/armv8/*rootfs*.tar.gz /output/ || true
              [ -f profiles.json ] && cp -av profiles.json /output/profiles.json || true
          '

      - name: 校验最终固件产物与 Kernel ABI
        id: check
        run: |
          set -euo pipefail
          ls -lh output
          
          ib_abi="$(jq -r '.linux_kernel.vermagic' output/profiles.json)"
          official_abi='${{ steps.official.outputs.official_abi }}'
          
          echo "Official ABI: $official_abi"
          echo "Built Image ABI: $ib_abi"
          
          test "$ib_abi" = "$official_abi"
          echo "abi=$ib_abi" >> "$GITHUB_OUTPUT"

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HINLINK-H28K-Custom-${{ steps.release.outputs.tag }}-${{ steps.check.outputs.abi }}
          path: output/*
          retention-days: 30

      - name: 发布固件到 Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h28k-custom-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.date }}
          name: HINLINK H28K 定制版固件 ${{ steps.release.outputs.tag }}
          body: |
            - 上游版本：${{ steps.release.outputs.tag }}
            - 包含组件：Nikki + Design/Fluent 主题（源码编译）
            - 官方 Kernel ABI：`${{ steps.check.outputs.abi }}`
          files: output/*
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
