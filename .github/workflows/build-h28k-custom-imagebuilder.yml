name: 使用 Docker ImageBuilder 定制 H28K 固件

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'ImmortalWrt release tag'
        required: true
        default: 'v25.12.1'
        type: string
      rootfs_partsize:
        description: 'RootFS 分区大小'
        required: true
        default: '2048'

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备第三方 APK 包 (直接下载预编译版)
        run: |
          mkdir -p extra-apks
          # 这里直接下载 nikki 预编译包，不再自行编译源码
          curl -L "https://github.com/nikkinikki-org/OpenWrt-nikki/releases/latest/download/nikki_aarch64_cortex-a53.apk" -o extra-apks/nikki.apk || \
          curl -L "https://github.com/nikkinikki-org/OpenWrt-nikki/releases/latest/download/luci-app-nikki_aarch64_cortex-a53.apk" -o extra-apks/luci-app-nikki.apk
          
          # 如果你有本地的主题 .apk，请放入 extra-apks 文件夹中
          # 如果没有，建议直接使用官方源已有的 luci-theme-argon 等
          ls -la extra-apks/

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包固件
        run: |
          # 1. 自动根据版本获取镜像
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/h28k-imagebuilder:${{ inputs.target_tag }}-official-buildinfo-full"
          
          # 2. 定义安装包，注意这里直接写 apk 包名（如 nikki）
          # 必须包含官方的 kmod-rtw88-8821cu / kmod-rtw88-8822bu 以支持 USB 网卡
          PACKAGES="luci-app-diskman luci-app-dockerman dockerd luci-app-openclash nikki luci-theme-argon kmod-rtw88-8821cu kmod-rtw88-8822bu"
          
          mkdir -p output
          
          # 3. 运行容器打包
          docker run --rm \
            -e PACKAGES="$PACKAGES" \
            -e ROOTFS_PARTSIZE="${{ inputs.rootfs_partsize }}" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -v "$GITHUB_WORKSPACE/extra-apks:/packages/extra:ro" \
            "$IMAGE_NAME" '
            set -euo pipefail
            
            # 将 extra-apks 注入到本地软件源目录
            cp -av /packages/extra/*.apk packages/ 2>/dev/null || true
            
            # 建立包索引（关键步骤，ImageBuilder 必须要有 Packages.manifest 和 index）
            cd packages
            ../scripts/ipkg-make-index.sh . > Packages
            gzip -c Packages > Packages.gz
            cd ..

            # 打包
            make image PROFILE=hinlink_h28k PACKAGES="$PACKAGES" ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE"
            
            cp -av bin/targets/rockchip/armv8/*sysupgrade.img.gz /output/
          '

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: H28K-Firmware-${{ inputs.target_tag }}
          path: output/*
